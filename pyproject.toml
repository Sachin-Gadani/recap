[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-local"
version = "0.1.0"
description = "Turn longform meeting and interview audio into an executive summary, entirely on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["whisper", "transcription", "meeting-notes", "summarization", "local-llm", "ollama", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business",
]
# The core pipeline has no third-party runtime dependencies: the LLM is reached
# over plain HTTP with the standard library. Transcription needs one extra.
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
recap = "recap.cli:main"

[project.urls]
Homepage = "https://github.com/Sachin-Gadani/recap"
Issues = "https://github.com/Sachin-Gadani/recap/issues"

[tool.setuptools.packages.find]
include = ["recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
